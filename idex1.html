<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة إدارة الطلبات</title>
  <style>
    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      position: relative;
      overflow-x: hidden;
    }

    /* الهيدر */
    .header {
      background: #1c1c1c;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .header .title {
      font-size: 20px;
      font-weight: bold;
      color: #4da3ff;
    }

    .buttons button {
      margin-left: 10px;
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .buttons button a {
      color: white;
      text-decoration: none;
    }

    .logout {
      background: #ff4d4d;
      color: white;
    }

    .store {
      background: #6c5ce7;
      color: white;
    }

    /* الكروت */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .card {
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }

    .yellow { background: linear-gradient(45deg, #f1c40f, #f39c12); }
    .blue { background: linear-gradient(45deg, #3498db, #2980b9); }
    .green { background: linear-gradient(45deg, #2ecc71, #27ae60); }

    .icon {
      font-size: 30px;
      opacity: 0.8;
    }

    /* البحث */
    .search-box {
      margin: 20px;
      background: #1c1c1c;
      padding: 15px;
      border-radius: 12px;
    }

    .search-box input, 
    .search-box select {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      background: #2b2b2b;
      color: white;
      width: 180px;
    }

    .result {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }

    .orders {
      padding: 20px;
    }

    .orders table {
      width: 100%;
      border-collapse: collapse;
      background: #1c1c1c;
      border-radius: 12px;
      overflow: hidden;
    }

    .orders th, .orders td {
      padding: 14px 12px;
      text-align: right;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    .orders th {
      background: #111;
      color: #bbb;
      font-weight: 700;
    }

    .orders tr:hover {
      background: #222;
    }

    .empty-orders {
      padding: 20px;
      color: #aaa;
      font-size: 14px;
      text-align: center;
    }

    /* تسجيل الدخول */
    #login {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-form {
      background: linear-gradient(rgba(15,15,15,0.9), rgba(15,15,15,0.9)), url("WhatsApp Image 2026-04-27 at 23.08.42.jpeg") center / cover no-repeat;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 300px;
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .login-form::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .login-form h2 {
      color: #4da3ff;
      margin-bottom: 20px;
    }

    .login-form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #2b2b2b;
      color: white;
      font-size: 16px;
    }

    .login-form button {
      width: 100%;
      padding: 12px;
      background: #4da3ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    .login-form button:hover {
      background: #3a8fd6;
    }
  </style>
</head>

<body>

  <div id="main">
    <!-- الهيدر -->
    <div class="header">
    <div class="title">لوحة إدارة الطلبات</div>

    <div class="buttons">
      <button class="store"><a href="index.html">عرض المتجر</a></button>
    </div>
  </div>

  <!-- الكروت -->
  <div class="cards">
    <div class="card yellow">
      <div>طلبات معلقة <br> <span id="pendingCount">0</span></div>
      <div class="icon">⏳</div>
    </div>

    <div class="card blue">
      <div>إجمالي الطلبات <br> <span id="totalCount">0</span></div>
      <div class="icon">📦</div>
    </div>

    <div class="card blue">
      <div>طلبات اليوم <br> <span id="todayCount">0</span></div>
      <div class="icon">📅</div>
    </div>

    <div class="card green">
      <div>إجمالي المبيعات <br> <span id="salesTotal">0</span> درهم مغربي</div>
      <div class="icon">💰</div>
    </div>
  </div>

  <!-- البحث -->
  <div class="search-box">
    <input type="text" placeholder="رقم الطلب أو اسم المنتج">

    <select>
      <option>حالة الطلب</option>
      <option>جميع الحالات</option>
      <option>قيد المعالجة</option>
      <option>مكتمل</option>
    </select>

    <input type="date">
    <input type="date">

    <div class="result" id="ordersResult">عرض 0 من 0 طلب</div>
  </div>

  <div class="orders" id="ordersSection">
    <button id="autoRefreshBtn" onclick="toggleAutoRefresh()">تحديث تلقائي</button>
    <table id="ordersTable">
      <thead>
        <tr>
          <th>رقم الطلب</th>
          <th>تفاصيل العميل</th>
          <th>المنتج</th>
          <th>السعر</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
    <div class="empty-orders" id="emptyOrders">لا توجد طلبات حتى الآن</div>
  </div>

  </div>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCDDJaRYjylVnWaL0noh4WrJmeHjrMwsUE",
    authDomain: "uessar-45780.firebaseapp.com",
    databaseURL: "https://uessar-45780-default-rtdb.firebaseio.com",
    projectId: "uessar-45780",
    storageBucket: "uessar-45780.firebasestorage.app",
    messagingSenderId: "448162772383",
    appId: "1:448162772383:web:f292a8fa30bd7135feb9aa"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ordersRef = ref(db, 'orders');

  function formatOrderNumber(index) {
    return '#'+(1001 + index);
  }

  var previousOrderCount = 0;

  function playNotificationSound() {
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var oscillator = audioCtx.createOscillator();
      var gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      var now = audioCtx.currentTime;
      // Ringtone-like sequence: high-low-high-low repeated
      oscillator.frequency.setValueAtTime(880, now);
      oscillator.frequency.setValueAtTime(660, now + 0.15);
      oscillator.frequency.setValueAtTime(880, now + 0.3);
      oscillator.frequency.setValueAtTime(660, now + 0.45);
      oscillator.frequency.setValueAtTime(880, now + 0.6);
      oscillator.frequency.setValueAtTime(660, now + 0.75);
      gainNode.gain.setValueAtTime(0.4, now);
      gainNode.gain.setValueAtTime(0.4, now + 0.9);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start(now);
      oscillator.stop(now + 0.9);
    } catch (e) {
      console.log('Audio not supported', e);
    }
  }

  onValue(ordersRef, (snapshot) => {
    const data = snapshot.val();
    const orders = data ? Object.values(data) : [];
    const keys = data ? Object.keys(data) : [];
    var totalCount = orders.length;
    var todayCount = 0;
    var pendingCount = totalCount;
    var salesTotal = 0;

    if (totalCount > previousOrderCount && previousOrderCount > 0) {
      playNotificationSound();
    }
    previousOrderCount = totalCount;

    var tbody = document.querySelector('#ordersTable tbody');
    tbody.innerHTML = '';

    if (orders.length === 0) {
      document.getElementById('ordersTable').style.display = 'none';
      document.getElementById('emptyOrders').style.display = 'block';
    } else {
      document.getElementById('ordersTable').style.display = 'table';
      document.getElementById('emptyOrders').style.display = 'none';
    }

    orders.forEach(function(order, index) {
      var row = document.createElement('tr');
      var orderDate = new Date(order.date);
      var today = new Date();
      if (orderDate.toDateString() === today.toDateString()) {
        todayCount += 1;
      }

      var priceValue = parseFloat(order.price.replace(/[^0-9.]/g, '')) || 0;
      salesTotal += priceValue;

      row.innerHTML = '<td>' + formatOrderNumber(index) + '</td>' +
        '<td><strong>' + order.name + '</strong><br>' + order.address + '<br><span style="color:#ccc;">' + order.phone + '</span><br>' +
        '<a href="tel:' + order.phone + '" style="text-decoration:none;"><button style="background:#4CAF50;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;margin:2px;font-size:12px;">📞 اتصال</button></a> ' +
        '<a href="https://wa.me/' + order.phone.replace(/[^0-9]/g, '') + '" target="_blank" style="text-decoration:none;"><button style="background:#25D366;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;margin:2px;font-size:12px;">💬 واتساب</button></a></td>' +
        '<td>' + order.product + '</td>' +
        '<td>' + order.price + '</td>' +
        '<td>' + (order.displayDate || order.date) + '</td>';

      tbody.appendChild(row);
    });

    document.getElementById('pendingCount').textContent = pendingCount;
    document.getElementById('totalCount').textContent = totalCount;
    document.getElementById('todayCount').textContent = todayCount;
    document.getElementById('salesTotal').textContent = salesTotal.toFixed(2);
    document.getElementById('ordersResult').textContent = 'عرض ' + totalCount + ' من ' + totalCount + ' طلب';
  });

  let autoRefreshInterval;
  function toggleAutoRefresh() {
    const btn = document.getElementById('autoRefreshBtn');
    if (autoRefreshInterval) {
      clearInterval(autoRefreshInterval);
      autoRefreshInterval = null;
      btn.textContent = 'تحديث البيانات تلقائياً';
    } else {
      autoRefreshInterval = setInterval(() => {
        // Real-time, no need
      }, 60000);
      btn.textContent = 'إيقاف التحديث';
    }
  }

  // Make functions global
  window.toggleAutoRefresh = toggleAutoRefresh;

  // Start auto-refresh automatically
  toggleAutoRefresh();
</script>

</body>
</html>
